AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Provisions everything the jenkins-certbot-letsencrypt Jenkinsfile needs:
  an IAM user scoped to exactly the Route53/S3 actions the pipeline calls,
  the S3 bucket certificates get uploaded to, and an AWS Secrets Manager
  secret holding that user's access key. No secret value is ever written
  to a CloudFormation Output, the template, or this repo — it only ever
  exists inside Secrets Manager (and, after you copy it out once, inside
  Jenkins' own credential store).

Parameters:
  DomainName:
    Type: String
    Description: Primary domain certificates will be requested for (used only for tagging/naming, not to create DNS records)

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing Route53 hosted zone ID that contains DomainName

  S3BucketName:
    Type: String
    Description: S3 bucket certificates will be uploaded to (must be globally unique if CreateS3Bucket=true)

  CreateS3Bucket:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: 'true: this stack creates S3BucketName. false: S3BucketName already exists and this stack only scopes IAM to it.'

  IAMUserName:
    Type: String
    Default: jenkins-certbot
    Description: Name of the IAM user Jenkins authenticates as (access key is generated by this stack and stored in Secrets Manager, never output in plaintext)

Conditions:
  ShouldCreateBucket: !Equals [!Ref CreateS3Bucket, 'true']

Resources:

  CertBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateBucket
    Properties:
      BucketName: !Ref S3BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-jenkins-certbot-healthchecks
            Prefix: _healthcheck/
            Status: Enabled
            ExpirationInDays: 1
      Tags:
        - Key: Domain
          Value: !Ref DomainName
        - Key: Purpose
          Value: jenkins-certbot-letsencrypt

  CertbotPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${IAMUserName}-policy"
      Description: Least-privilege policy for the jenkins-certbot-letsencrypt pipeline
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Route53ListZonesGlobal
            Effect: Allow
            Action:
              - route53:ListHostedZones
              - route53:ListHostedZonesByName
              - sts:GetCallerIdentity
            Resource: '*'
          - Sid: Route53ChallengeRecordOnTargetZone
            Effect: Allow
            Action:
              - route53:GetHostedZone
              - route53:ListResourceRecordSets
              - route53:ChangeResourceRecordSets
            Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
          - Sid: Route53ChangeStatusPolling
            Effect: Allow
            Action: route53:GetChange
            Resource: "arn:aws:route53:::change/*"
          - Sid: S3ListBucketForHealthcheck
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub "arn:aws:s3:::${S3BucketName}"
          - Sid: S3CertObjectReadWrite
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub "arn:aws:s3:::${S3BucketName}/*"

  CertbotUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref IAMUserName
      ManagedPolicyArns:
        - !Ref CertbotPolicy
      Tags:
        - Key: Purpose
          Value: jenkins-certbot-letsencrypt

  CertbotAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref CertbotUser

  # The access key's secret half is injected here via !Sub/GetAtt at deploy time.
  # It is written straight into Secrets Manager and is never exposed as a Stack
  # Output, in `aws cloudformation describe-stacks`, or anywhere in this repo.
  CertbotCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${IAMUserName}-aws-credentials"
      Description: !Sub "AWS credentials for the Jenkins jenkins-certbot-letsencrypt pipeline (${DomainName})"
      SecretString: !Sub |
        {
          "AWS_ACCESS_KEY_ID": "${CertbotAccessKey}",
          "AWS_SECRET_ACCESS_KEY": "${CertbotAccessKey.SecretAccessKey}"
        }

Outputs:
  IAMUserArn:
    Value: !GetAtt CertbotUser.Arn

  SecretsManagerSecretName:
    Value: !Ref CertbotCredentialsSecret
    Description: >
      Retrieve this secret's value once (console or
      `aws secretsmanager get-secret-value --secret-id <this name> --query SecretString --output text`)
      and paste AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY into the two Jenkins "Secret text" credentials.
      The value is never printed by this stack.

  S3BucketNameForJenkins:
    Value: !Ref S3BucketName
    Description: Use as the Jenkins S3_BUCKET_NAME build parameter

  HostedZoneIdForJenkins:
    Value: !Ref HostedZoneId
    Description: Use as the Jenkins HOSTED_ZONE_ID build parameter
